pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'simplefluidtanks'

includeBuild("libs/simplemodslib") {
    dependencySubstitution {
        substitute module("net.zarathul:simplemodslib") using project(":")
    }
}